name: Release

# Builds the frontend and attaches diorama.zip to a published release. That
# zip is what the Marketplace installs (zip_release in hacs.json).

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and attach diorama.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(jq -r .version custom_components/diorama/manifest.json)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match manifest version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Zip the integration
        working-directory: custom_components/diorama
        run: zip -r "$GITHUB_WORKSPACE/diorama.zip" . -x '*/__pycache__/*' -x '*.pyc'
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" diorama.zip --clobber
