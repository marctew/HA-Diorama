name: Release

# Builds the frontend and attaches diorama.zip to a release. That zip is what
# the Marketplace installs (zip_release in hacs.json).
#
# Three ways in: publish a release on GitHub by hand; push a tag that is a
# version number; or run this workflow from the Actions tab on the branch to
# release, which tags it with the version in the manifest. In the last two
# the release is made here, with the changelog since the last release as its
# notes.

on:
  release:
    types: [published]
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build and attach diorama.zip
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        env:
          GIVEN: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          version="$(jq -r .version custom_components/diorama/manifest.json)"
          # Run by hand, the tag is the version in the manifest.
          tag="${GIVEN:-$version}"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag $tag does not match manifest version $version"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "release" ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::There is already a release $tag. Raise the version in the manifest first"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Zip the integration
        working-directory: custom_components/diorama
        run: zip -r "$GITHUB_WORKSPACE/diorama.zip" . -x '*/__pycache__/*' -x '*.pyc'
      - name: Write the release notes
        if: github.event_name != 'release'
        run: |
          # Everything in the changelog since the last release: a version
          # that was never released on its own is not left out.
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          awk -v tag="${TAG#v}" -v previous="${previous#v}" '
            $1 == "##" && $2 == tag { on = 1 }
            $1 == "##" && previous != "" && $2 == previous { on = 0 }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          cat notes.md
      - name: Make the release
        if: github.event_name != 'release'
        # Makes the tag too, on this commit, if it was not pushed.
        run: gh release create "$TAG" diorama.zip --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
      - name: Attach it to the release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" diorama.zip --clobber
