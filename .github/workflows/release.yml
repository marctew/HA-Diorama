name: Release

# Builds the frontend and attaches diorama.zip to a release. That zip is what
# the Marketplace installs (zip_release in hacs.json).
#
# Two ways in: publish a release on GitHub by hand, or push a tag that is a
# version number, and the release is made here with that version's section of
# CHANGELOG.md as its notes.

on:
  release:
    types: [published]
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  package:
    name: Build and attach diorama.zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the manifest version
        run: |
          version="$(jq -r .version custom_components/diorama/manifest.json)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match manifest version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Zip the integration
        working-directory: custom_components/diorama
        run: zip -r "$GITHUB_WORKSPACE/diorama.zip" . -x '*/__pycache__/*' -x '*.pyc'
      - name: Write the release notes
        if: github.event_name == 'push'
        run: |
          # Everything in the changelog since the last release: a version
          # that was never released on its own is not left out.
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          awk -v tag="${TAG#v}" -v previous="${previous#v}" '
            $1 == "##" && $2 == tag { on = 1 }
            $1 == "##" && previous != "" && $2 == previous { on = 0 }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          cat notes.md
      - name: Make the release
        if: github.event_name == 'push'
        run: gh release create "$TAG" diorama.zip --title "$TAG" --notes-file notes.md --verify-tag
      - name: Attach it to the release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" diorama.zip --clobber
